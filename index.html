<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="logo/logo.png" type="image/x-icon">
    <title>HotFood</title>
</head>

<body>

    <section class="main">
        <div class="container">
            <header class="header">
                <a href="#" class="logo">
                    <img src="images/logo.svg" alt="" class="logo_image">
                </a>

                <nav class="menu">
                    <ul class="menu_list">
                        <li class="menu_item">
                            <a href="" class="menu_link">Главная</a>
                        </li>
                        <li class="menu_item">
                            <a href="" class="menu_link">Друзья</a>
                        </li>
                        <li class="menu_item">
                            <a href="" class="menu_link">О сервисе</a>
                        </li>
                        <li class="menu_item">
                            <a href="" class="menu_link">Контакты</a>
                        </li>
                    </ul>
                </nav>

                <div class="phone">
                    <img src="images/phone_icon.svg" class="phone_icon" alt="">
                    <a href="tel:7991254302" class="phone_number">+7 991-25-43-02</a>
                </div>
            </header>

            <div class="info">
                <div class="info--content">
                    <h1 class="info--titel">
                        Вкусная еда <br>
                        с доставкой на дом
                    </h1>
                    <p class="info--text">
                        Онлайн-магазин самой вкусной и почти здоровой еды
                    </p>
                    <a href="#" class="info--link">
                        Выбрать обед
                    </a>
                </div>
                <img src="images/pizza.svg" alt="" class="info--img">
            </div>
            <div class="food">
                <a href="#" class="food--item">
                    <h3 class="food--titel">
                        пицца <img src="images/arrow.svg" alt="">
                    </h3>
                    <img src="images/pizza-icon.svg" alt="">
                </a>

                <a href="#" class="food--item">
                    <h3 class="food--titel">
                        картишка фри <img src="images/arrow.svg" alt="">
                    </h3>
                    <img src="images/fri-icon.svg" alt="">
                </a>
            </div>
        </div>
    </section>
</body>

</html>
